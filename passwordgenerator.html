<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="passwordgenerator.css"> 
</head>
<body>
<h1>Password Generator</h1>

<div id="container">
<p>Password Length:[12]</p>

<input type="button" id="pass" value="Generate"  onclick="passwordgen()">
<hr>
<p id="result"></p>

</div>

<script>

let password="";
let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
function passwordgen()
{
	password="";
	
	for(let i=0;i<12;i++)
	{
		let result=Math.floor(Math.random() * chars.length);
		password = password + chars[result];
		
	}

 	document.getElementById("result").innerHTML=password ;
        if (document.getElementById("copyBtn") == null) {
        let btn = document.createElement("button");
        btn.id = "copyBtn";
        btn.innerText = "Copy";

        btn.onclick = function() {
            navigator.clipboard.writeText(password);
            alert("Copied");
        };

        document.getElementById("container").appendChild(btn);
    }
}
</script>

</body>
</html>
